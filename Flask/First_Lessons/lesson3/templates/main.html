{% extends "base.html" %}

{% block title %}Main page{% endblock %}
{% block header %}<h1>Main page</h1>{% endblock %}

{% block content %}
    <h2>ZAHAR_SHOP_TOP</h2>
    {% for item in items %}
        <div class="card">
            <h3>{{loop.index}}, {{item.name}}</h3>
            <h4>Price: {{item.price}}</h4>
        </div>
    {% endfor %}
{% endblock %}
