<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор группы</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="bg-decor decor-1">武</div>
    <div class="bg-decor decor-2">道</div>
    <div class="bg-decor decor-3">禅</div>
    <div class="bg-decor decor-4">和</div>

    <div class="account-card">
        <h1>Выбери группу <span>//</span> Path</h1>

        <form action="/save-user" method="post">
            <input type="hidden" name="username" value="{{ username }}">
            <input type="hidden" name="age" value="{{ age }}">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="password" value="{{ password }}">

            <button type="submit" name="group" value="Programmer" class="logout-btn" style="margin-top: 15px;">Programmer</button>
            <button type="submit" name="group" value="Designer" class="logout-btn" style="margin-top: 15px;">Designer</button>
            <button type="submit" name="group" value="Engineer" class="logout-btn" style="margin-top: 15px;">Engineer</button>
            <button type="submit" name="group" value="Modeller" class="logout-btn" style="margin-top: 15px;">Modeller</button>
        </form>
    </div>

</body>
</html>
