{% extends 'base.html' %}
{% block title %}Note Creating{% endblock %}

{% block content %}
<h1>New Note</h1>

<form method="POST">
    {{ form.hidden_tag() }}

    <div class="form-group">
        {{ form.title.label }}
        {{ form.title() }}
    </div>

    <div class="form-group">
        {{ form.content.label }}
        {{ form.content() }}
    </div>

    <div style="margin-top: 30px;">
        {{ form.submit() }}
    </div>
</form>
{% endblock %}
