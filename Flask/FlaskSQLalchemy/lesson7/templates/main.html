{% extends 'base.html' %}
{% block title %}Главная{% endblock %}

{% block content %}
<h1>Your Notes</h1>

<div class="notes-grid">
    {% for note in notes %}
    <div class="note-card">
        <h2>{{ note.title }}</h2>
        <div class="btn-group">
            <a href="/note/{{ note.id }}" class="btn btn-secondary">Open</a>
            <a href="/delete-note/{{ note.id }}" class="btn btn-danger">Delete</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
