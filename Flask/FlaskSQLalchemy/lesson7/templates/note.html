{% extends 'base.html' %}
{% block title %}{{ note.title }}{% endblock %}

{% block content %}
<div class="note-card" style="max-width: 600px; margin: 0 auto;">
    <h5>Title</h5>
    <h1>{{ note.title }}</h1>

    <h5>Description</h5>
    <p style="font-size: 1.1rem; line-height: 1.6; color: #e1dbec; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 6px;">
        {{ note.content }}
    </p>

    <div class="btn-group">
        <a href="/" class="btn btn-secondary">Return</a>
        <a href="/delete-note/{{ note.id }}" class="btn btn-danger">Delete</a>
    </div>
</div>
{% endblock %}
