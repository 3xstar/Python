{% extends 'base.html' %}
{% block title %}Main Page{% endblock %}

{% block content %}
<!-- Блок поиска -->
<div class="search-section">
    <form action="/" method="POST" class="search-form">
        <label for="search-input">Search by Title</label>
        <div class="search-group">
            <input type="text" id="search-input" name="search-request" value="{{ search_data }}" placeholder="Type title to find...">
            <button type="submit">Search</button>
        </div>
    </form>
</div>

<!-- Сетка карточек -->
<div class="notes-grid">
    {% for note in notes %}
    <div class="note-card">
        <h2>{{ note.title }}</h2>

        <div class="btn-group">
            <a href="/note/{{ note.id }}" class="btn btn-primary">Open</a>
            <a href="/edit-note/{{ note.id }}" class="btn btn-edit">Edit</a>
            <a href="/delete-note/{{ note.id }}" class="btn btn-danger">Delete</a>
        </div>
    </div>
    {% else %}
    <div class="no-notes">
        <p>The dark corridor is empty. No notes found.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
